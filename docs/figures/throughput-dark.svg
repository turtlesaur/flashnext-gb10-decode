<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-label="Throughput, single-stream and concurrent" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect width="820" height="500" fill="#1a1a19"/><text x="24.0" y="34.0" fill="#ffffff" font-size="17" text-anchor="start" font-weight="600">The gain is a single-stream effect</text><text x="24.0" y="55.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">Aggregate tokens/s, 7 repetitions, median. Batching already amortises the output head, so concurrency</text><text x="24.0" y="72.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">keeps far less of it.</text><rect x="150.0" y="83.0" width="11" height="11" rx="2.5" fill="#3987e5"/><text x="167.0" y="92.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">baseline</text><rect x="227.0" y="83.0" width="11" height="11" rx="2.5" fill="#d95926"/><text x="244.0" y="92.0" fill="#c3c2b7" font-size="12.5" text-anchor="start" font-weight="400">reduced draft vocab + fp8 side layers</text><line x1="215.6" y1="110.0" x2="215.6" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="281.1" y1="110.0" x2="281.1" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="346.7" y1="110.0" x2="346.7" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="412.2" y1="110.0" x2="412.2" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="477.8" y1="110.0" x2="477.8" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="543.3" y1="110.0" x2="543.3" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="608.9" y1="110.0" x2="608.9" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="674.4" y1="110.0" x2="674.4" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><line x1="740.0" y1="110.0" x2="740.0" y2="456.0" stroke="#2c2c2a" stroke-width="1"/><text x="138.0" y="131.0" fill="#c3c2b7" font-size="12" text-anchor="en