<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Effective bandwidth by access path" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect width="820" height="300" fill="#fcfcfb"/><text x="24.0" y="34.0" fill="#0b0b0b" font-size="17" text-anchor="start" font-weight="600">"Unified" memory is not uniform</text><text x="24.0" y="55.0" fill="#52514e" font-size="12.5" text-anchor="start" font-weight="400">One physical LPDDR5X pool, three access paths. cudaHostGetDevicePointer returns the identical pointer.</text><line x1="407.5" y1="84.0" x2="407.5" y2="260.0" stroke="#e1e0d9" stroke-width="1"/><line x1="515.0" y1="84.0" x2="515.0" y2="260.0" stroke="#e1e0d9" stroke-width="1"/><line x1="622.5" y1="84.0" x2="622.5" y2="260.0" stroke="#e1e0d9" stroke-width="1"/><line x1="730.0" y1="84.0" x2="730.0" y2="260.0" stroke="#e1e0d9" stroke-width="1"/><text x="286.0" y="114.0" fill="#52514e" font-size="13" text-anchor="end" font-weight="400">GPU reads device memory</text><path d="M300.0,92.0 H666.1 a4,4 0 0 1 4,4 V122.0 a4,4 0 0 1 -4,4 H300.0 Z" fill="#0d366b"/><text x="679.1" y="114.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">241 GB/s</text><text x="286.0" y="160.0" fill="#52514e" font-size="13" text-anchor="end" font-weight="400">GPU reads pinned host memory</text><path d="M300.0,138.0 H414.2 a4,4 0 0 1 4,4 V168.0 a4,4 0 0 1 -4,4 H300.0 Z" fill="#3987e5"/><text x="427.2" y="160.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">77 GB/s</text><text x="286.0" y="206.0" fill="#52514e" font-size="13" text-anchor="end" font-weight="400">cudaMemcpy host to device</text><path d="M300.0,184.0 H386.6 a4,4 0 0 1 4,4 V214.0 a4,4 0 0 1 -4,4 H300.0 Z" fill="#86b6ef"/><text x="399.6" y="206.0" fill="#0b0b0b" font-size="13" text-anchor="start" font-weight="600">59 GB/s</text><line x1="300" y1="84.0" x2="300" y2="260.0" stroke="#c3c2b7" stroke-width="1"/><text x="300.0" y="278.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">0</text><text x="407.5" y="278.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">70</text><text x="515.0" y="278.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">140</text><text x="622.5" y="278.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">210</text><text x="730.0" y="278.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">280</text><text x="515.0" y="294.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">effective bandwidth, GB/s</text></svg>