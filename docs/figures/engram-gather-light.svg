<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Engram row gather strategies" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><rect width="820" height="330" fill="#fcfcfb"/><text x="24.0" y="34.0" fill="#0b0b0b" font-size="17" text-anchor="start" font-weight="600">Engram gather: page faults vs explicit reads</text><text x="24.0" y="55.0" fill="#52514e" font-size="12.5" text-anchor="start" font-weight="400">Median time to fetch 180 random 160-byte rows from the 51 GB on-disk n-gram table. Lower is better.</text><rect x="190.0" y="79.0" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="207.0" y="88.0" fill="#52514e" font-size="12.5" text-anchor="start" font-weight="400">np.memmap fancy index (ships today)</text><rect x="456.0" y="79.0" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="473.0" y="88.0" fill="#52514e" font-size="12.5" text-anchor="start" font-weight="400">os.pread, 8 threads</text><line x1="370.0" y1="106.0" x2="370.0" y2="286.0" stroke="#e1e0d9" stroke-width="1"/><line x1="550.0" y1="106.0" x2="550.0" y2="286.0" stroke="#e1e0d9" stroke-width="1"/><line x1="730.0" y1="106.0" x2="730.0" y2="286.0" stroke="#e1e0d9" stroke-width="1"/><text x="176.0" y="132.0" fill="#52514e" font-size="12.5" text-anchor="end" font-weight="400">cold cache, uniform rows</text><path d="M190.0,112.0 H562.8 a4,4 0 0 1 4,4 V127.0 a4,4 0 0 1 -4,4 H190.0 Z" fill="#2a78d6"/><text x="574.8" y="126.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">31.4 ms</text><path d="M190.0,133.0 H232.8 a4,4 0 0 1 4,4 V148.0 a4,4 0 0 1 -4,4 H190.0 Z" fill="#eb6834"/><text x="244.8" y="147.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">3.9 ms</text><text x="176.0" y="194.0" fill="#52514e" font-size="12.5" text-anchor="end" font-weight="400">cold cache, skewed rows</text><path d="M190.0,174.0 H274.8 a4,4 0 0 1 4,4 V189.0 a4,4 0 0 1 -4,4 H190.0 Z" fill="#2a78d6"/><text x="286.8" y="188.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">7.4 ms</text><path d="M190.0,195.0 H240.0 a4,4 0 0 1 4,4 V210.0 a4,4 0 0 1 -4,4 H190.0 Z" fill="#eb6834"/><text x="252.0" y="209.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">4.5 ms</text><text x="176.0" y="256.0" fill="#52514e" font-size="12.5" text-anchor="end" font-weight="400">fully warm</text><path d="M190.0,236.0 H222.0 a4,4 0 0 1 4,4 V251.0 a4,4 0 0 1 -4,4 H190.0 Z" fill="#2a78d6"/><text x="234.0" y="250.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">3.0 ms</text><path d="M190.0,257.0 H232.8 a4,4 0 0 1 4,4 V272.0 a4,4 0 0 1 -4,4 H190.0 Z" fill="#eb6834"/><text x="244.8" y="271.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">3.9 ms</text><text x="560.8" y="100.0" fill="#0b0b0b" font-size="12.5" text-anchor="end" font-weight="600">6.7x</text><line x1="190" y1="106.0" x2="190" y2="286.0" stroke="#c3c2b7" stroke-width="1"/><text x="190.0" y="304.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">0</text><text x="370.0" y="304.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">15</text><text x="550.0" y="304.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">30</text><text x="730.0" y="304.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">45</text><text x="460.0" y="321.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">milliseconds per gather</text></svg>